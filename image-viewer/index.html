<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片查看器</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body.fullscreen {
            padding: 0;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .drop-zone {
            width: 100%;
            max-width: 600px;
            height: 300px;
            border: 4px dashed rgba(255,255,255,0.7);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background: rgba(255,255,255,0.2);
            border-color: white;
            transform: scale(1.02);
        }

        .drop-zone svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .image-container {
            margin-top: 30px;
            max-width: 100%;
            display: none;
        }

        .image-container.show {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #preview {
            max-width: 100%;
            max-height: 600px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .image-container.show #preview {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            border-radius: 0;
            box-shadow: none;
            object-fit: contain;
            cursor: zoom-in;
        }

        .image-index {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 200;
            display: none;
        }

        body.fullscreen .image-index {
            display: block;
        }

        .info-popup {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.7);
            padding: 24px;
            border-radius: 12px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 300;
            display: none;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            cursor: grab;
        }

        .info-popup.show {
            display: block;
        }

        .info-popup h3 {
            margin-bottom: 16px;
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
        }

        .info-popup ul {
            list-style: none;
            padding: 0;
        }

        .info-popup li {
            margin-bottom: 4px;
        }

        .info-popup .label {
            font-weight: 600;
            color: #555;
            display: inline-block;
            min-width: 80px;
        }

        .info-popup .value {
            color: #333;
        }

        .info-popup .no-exif {
            color: #888;
            font-style: italic;
        }

        .info-popup .filename {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .rotation-selector {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rotation-selector label {
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .rotation-selector input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>图片查看器</h1>

    <div class="rotation-selector">
        <input type="checkbox" id="rotate90">
        <label for="rotate90">顺时针旋转90°</label>
    </div>

    <div class="drop-zone" id="dropZone">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p>拖入图片/文件夹或点击选择</p>
    </div>

    <div class="image-container" id="imageContainer">
        <img id="preview" alt="预览图片">
    </div>

    <div class="image-index" id="imageIndex"></div>

    <input type="file" id="fileInput" accept="image/*" webkitdirectory directory style="display: none;">

    <div class="info-popup" id="infoPopup">
        <div id="exifContent"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const imageContainer = document.getElementById('imageContainer');
        const preview = document.getElementById('preview');
        const infoPopup = document.getElementById('infoPopup');
        const exifContent = document.getElementById('exifContent');
        const imageIndex = document.getElementById('imageIndex');
        const rotationSelect = document.getElementById('rotate90');
        let currentExifData = null;
        let imageFiles = [];
        let currentIndex = 0;
        let isZoomed = false;

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        function handleFiles(files) {
            imageFiles = files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            currentIndex = 0;
            showImage(currentIndex);
        }

        function showImage(index) {
            if (index < 0 || index >= imageFiles.length) return;
            currentIndex = index;

            imageIndex.textContent = `${currentIndex + 1} / ${imageFiles.length}`;

            const file = imageFiles[index];
            const shouldRotate = rotationSelect.checked;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let finalSrc = e.target.result;
                    
                    if (shouldRotate) {
                        // 使用Canvas旋转90度
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.height;
                        canvas.height = img.width;
                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.rotate(90 * Math.PI / 180);
                        ctx.drawImage(img, -img.width / 2, -img.height / 2);
                        finalSrc = canvas.toDataURL('image/jpeg', 0.95);
                    }
                    
                    preview.src = finalSrc;
                    imageContainer.classList.add('show');
                    dropZone.style.display = 'none';
                    document.querySelector('.rotation-selector').style.display = 'none';
                    document.body.classList.add('fullscreen');
                    document.querySelector('h1').style.display = 'none';

                    isZoomed = false;
                    preview.style.transform = 'scale(1)';
                    preview.style.transformOrigin = 'center center';
                    preview.style.cursor = 'zoom-in';

                    preview.onclick = (e) => {
                        if (!isZoomed) {
                            const rect = preview.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            const y = e.clientY - rect.top;
                            preview.style.transformOrigin = `${x}px ${y}px`;
                            preview.style.transform = 'scale(1)';
                            preview.style.cursor = 'zoom-out';
                            isZoomed = true;
                            setTimeout(() => {
                                preview.style.transform = 'scale(2)';
                            }, 0);
                        } else {
                            preview.style.transform = 'scale(1)';
                            preview.style.transformOrigin = 'center center';
                            preview.style.cursor = 'zoom-in';
                            isZoomed = false;
                        }
                    };

                    // 旋转后的图片不读取EXIF，直接显示文件名
                    if (shouldRotate) {
                        exifContent.innerHTML = '<p class="filename">' + file.name + '</p><p class="no-exif">图片已旋转，EXIF信息已丢弃</p>';
                    } else {
                        // 不旋转时读取EXIF
                        try {
                            exifr.parse(preview).then(function(data) {
                                currentExifData = data;
                                console.log('EXIF data:', currentExifData);
                                displayExifData(currentExifData, file.name);
                            }).catch(function(error) {
                                console.log('Error reading EXIF:', error);
                                exifContent.innerHTML = '<p class="filename">' + file.name + '</p><p class="no-exif">该图片没有EXIF信息</p>';
                            });
                        } catch (error) {
                            console.log('Error reading EXIF:', error);
                            exifContent.innerHTML = '<p class="filename">' + file.name + '</p><p class="no-exif">该图片没有EXIF信息</p>';
                        }
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayExifData(data, filename) {
            console.log('Displaying EXIF data:', data);
            
            const importantTags = [
                'Make', 'Model', 
                'LensMake', 'LensModel', 'LensID', 'LensSpecification',
                'DateTime', 'DateTimeOriginal',
                'ExposureTime', 'FNumber', 'ISOSpeedRatings',
                'FocalLength', 'GPSLatitude', 'GPSLongitude',
                'ImageWidth', 'ImageHeight', 
            ];

            let hasUsefulData = false;
            if (data && Object.keys(data).length > 0) {
                for (const tag of importantTags) {
                    if (data[tag] !== undefined && data[tag] !== null && data[tag] !== '') {
                        hasUsefulData = true;
                        break;
                    }
                }
            }

            console.log('Has useful data:', hasUsefulData);

            let html = '<p class="filename">' + filename + '</p>';

            if (!hasUsefulData) {
                exifContent.innerHTML = html + '<p class="no-exif">该图片没有EXIF信息</p>';
                return;
            }

            html += '<ul>';

            importantTags.forEach(tag => {
                if (data[tag] !== undefined && data[tag] !== null && data[tag] !== '') {
                    let value = data[tag];

                    if (tag === 'ExposureTime') {
                        if (value < 1) {
                            value = `1/${Math.round(1/value)}s`;
                        } else {
                            value = `${value}s`;
                        }
                    } else if (tag === 'DateTime' || tag === 'DateTimeOriginal') {
                        if (value instanceof Date) {
                            const year = value.getFullYear();
                            const month = String(value.getMonth() + 1).padStart(2, '0');
                            const day = String(value.getDate()).padStart(2, '0');
                            const hours = String(value.getHours()).padStart(2, '0');
                            const minutes = String(value.getMinutes()).padStart(2, '0');
                            const seconds = String(value.getSeconds()).padStart(2, '0');
                            value = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                        }
                    } else if (tag === 'FNumber') {
                        value = `f/${value}`;
                    } else if (tag === 'FocalLength') {
                        value = `${value}mm`;
                    } else if (tag === 'GPSLatitude' || tag === 'GPSLongitude') {
                        if (Array.isArray(value)) {
                            const degrees = value[0];
                            const minutes = value[1];
                            const seconds = value[2];
                            value = `${degrees}°${minutes}'${seconds.toFixed(2)}"`;
                        }
                    }

                    const labelMap = {
                        'Make': '相机品牌',
                        'Model': '相机型号',
                        'LensMake': '镜头品牌',
                        'LensModel': '镜头型号',
                        'LensID': '镜头ID',
                        'LensSpecification': '镜头规格',
                        'DateTime': '创建时间',
                        'DateTimeOriginal': '拍摄时间',
                        'ExposureTime': '曝光时间',
                        'FNumber': '光圈值',
                        'ISOSpeedRatings': 'ISO',
                        'FocalLength': '焦距',
                        'GPSLatitude': '纬度',
                        'GPSLongitude': '经度',
                        'ImageWidth': '宽度',
                        'ImageHeight': '高度'
                    };

                    html += `<li><span class="label">${labelMap[tag] || tag}:</span><span class="value">${value}</span></li>`;
                }
            });

            html += '</ul>';
            exifContent.innerHTML = html;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'i') {
                infoPopup.classList.toggle('show');
            } else if (e.key === 'ArrowLeft') {
                if (imageFiles.length > 0) {
                    const newIndex = currentIndex === 0 ? imageFiles.length - 1 : currentIndex - 1;
                    showImage(newIndex);
                }
            } else if (e.key === 'ArrowRight') {
                if (imageFiles.length > 0) {
                    const newIndex = currentIndex === imageFiles.length - 1 ? 0 : currentIndex + 1;
                    showImage(newIndex);
                }
            }
        });

        document.addEventListener('wheel', (e) => {
            if (imageFiles.length > 0) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 1 : -1;
                const newIndex = currentIndex === 0 && delta === -1 
                    ? imageFiles.length - 1 
                    : currentIndex === imageFiles.length - 1 && delta === 1 
                        ? 0 
                        : currentIndex + delta;
                showImage(newIndex);
            }
        }, { passive: false });

        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        infoPopup.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragOffsetX = e.clientX - infoPopup.getBoundingClientRect().left;
            dragOffsetY = e.clientY - infoPopup.getBoundingClientRect().top;
            infoPopup.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const x = e.clientX - dragOffsetX;
            const y = e.clientY - dragOffsetY;
            infoPopup.style.left = x + 'px';
            infoPopup.style.top = y + 'px';
            infoPopup.style.right = 'auto';
            infoPopup.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            infoPopup.style.cursor = 'grab';
        });
    </script>
</body>
</html>
