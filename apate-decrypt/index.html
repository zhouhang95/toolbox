<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apate 文件解密工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .upload-text {
            color: #666;
            font-size: 16px;
        }
        #fileInput {
            display: none;
        }
        .file-info {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .file-info.show {
            display: block;
        }
        .file-name {
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
        .file-size {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .processing {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .processing.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Apate 文件解密工具</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <input type="file" id="fileInput">
        </div>
        
        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <div class="processing" id="processing">
            <div class="spinner"></div>
            <div id="processingText">正在解密并下载...</div>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const MASK_LENGTH_INDICATOR_LENGTH = 4;
        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const processing = document.getElementById('processing');
        const processingText = document.getElementById('processingText');
        const status = document.getElementById('status');

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 拖拽
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            
            fileName.textContent = file.name;
            fileSize.textContent = `大小: ${formatSize(file.size)}`;
            fileInfo.classList.add('show');
            status.classList.remove('show');
            
            // 自动解密并下载
            autoDecryptAndDownload(file);
        }

        // 自动解密并下载
        async function autoDecryptAndDownload(file) {
            processingText.textContent = '正在解密并下载...';
            processing.classList.add('show');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = reveal(arrayBuffer);
                
                // 检测文件类型
                const extension = detectFileType(result);
                
                const blob = new Blob([result], { type: 'application/octet-stream' });
                
                // 自动下载
                const originalName = file.name;
                const newName = originalName.replace(/\.[^.]+$/, '') + '_decrypted' + extension;
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = newName;
                a.click();
                URL.revokeObjectURL(url);
                
                processing.classList.remove('show');
                showStatus('解密完成！类型: ' + extension.replace('.', '').toUpperCase(), 'success');
                
                // 重置状态
                setTimeout(() => {
                    fileInput.value = '';
                    fileInfo.classList.remove('show');
                }, 2000);
                
            } catch (err) {
                processing.classList.remove('show');
                showStatus('解密失败: ' + err.message, 'error');
            }
        }
        
        // 根据文件头检测文件类型
        function detectFileType(data) {
            if (data.length < 4) return '.bin';
            
            // ZIP: 50 4B 03 04
            if (data[0] === 0x50 && data[1] === 0x4B && data[2] === 0x03 && data[3] === 0x04) {
                return '.zip';
            }
            
            // RAR: 52 61 72 21
            if (data[0] === 0x52 && data[1] === 0x61 && data[2] === 0x72 && data[3] === 0x21) {
                return '.rar';
            }
            
            // 7z: 37 7A BC AF
            if (data[0] === 0x37 && data[1] === 0x7A && data[2] === 0xBC && data[3] === 0xAF) {
                return '.7z';
            }
            
            return '.bin';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }

        // 核心解密函数 - 对应 C# 的 Reveal 方法
        function reveal(arrayBuffer) {
            const dataView = new DataView(arrayBuffer);
            const totalLength = arrayBuffer.byteLength;
            
            // 1. 从文件末尾读取面具长度（4字节）
            if (totalLength < MASK_LENGTH_INDICATOR_LENGTH) {
                throw new Error('文件太小，不是有效的伪装文件');
            }
            
            const maskHeadLength = dataView.getInt32(totalLength - MASK_LENGTH_INDICATOR_LENGTH, true);
            
            // 验证面具长度是否合理
            if (maskHeadLength <= 0 || maskHeadLength > totalLength) {
                throw new Error('面具长度无效，可能不是伪装文件');
            }
            
            // 2. 读取逆序存储的原始头部
            let originalHead;
            const contentLength = totalLength - MASK_LENGTH_INDICATOR_LENGTH - maskHeadLength;
            
            if (maskHeadLength <= contentLength) {
                // 正常情况：面具长度小于真实文件长度
                const originalHeadStart = totalLength - MASK_LENGTH_INDICATOR_LENGTH - maskHeadLength;
                originalHead = new Uint8Array(arrayBuffer, originalHeadStart, maskHeadLength);
            } else {
                // 非正常情况：面具长度大于真实文件长度
                const originalHeadStart = maskHeadLength;
                const originalHeadLength = totalLength - MASK_LENGTH_INDICATOR_LENGTH - maskHeadLength;
                originalHead = new Uint8Array(arrayBuffer, originalHeadStart, originalHeadLength);
            }
            
            // 3. 反转原始头部（因为存储时是逆序的）
            const reversedHead = reverseByteArray(originalHead);
            
            // 4. 构建解密后的文件
            // 新文件长度 = 原长度 - 面具长度 - 4字节长度标记
            const newLength = totalLength - maskHeadLength - MASK_LENGTH_INDICATOR_LENGTH;
            const result = new Uint8Array(newLength);
            
            // 复制原始头部到开头
            result.set(reversedHead, 0);
            
            // 复制中间部分（面具头部之后到逆序原始头部之前的内容）
            const middleStart = maskHeadLength;
            const middleLength = newLength - maskHeadLength;
            if (middleLength > 0) {
                const middleData = new Uint8Array(arrayBuffer, middleStart, middleLength);
                result.set(middleData, maskHeadLength);
            }
            
            return result;
        }

        // 反转字节数组 - 对应 C# 的 ReverseByteArray 方法
        function reverseByteArray(buffer) {
            const result = new Uint8Array(buffer.length);
            for (let i = 0; i < buffer.length; i++) {
                result[i] = buffer[buffer.length - 1 - i];
            }
            return result;
        }
    </script>
</body>
</html>
